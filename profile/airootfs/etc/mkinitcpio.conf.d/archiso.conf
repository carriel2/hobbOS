# Drivers de vídeo pequenos (sem firmware) para o Plymouth mostrar o tema já no initramfs
# em máquinas virtuais (QEMU, VirtualBox/VMware). Em PCs reais com UEFI ele usa o
# framebuffer do firmware; os drivers grandes (i915, amdgpu...) ficam de fora de propósito.
MODULES=(bochs virtio_gpu vmwgfx)
HOOKS=(base udev microcode modconf plymouth memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
