LABEL arch
TEXT HELP
Boot the HobbOS live on BIOS.
It allows you to install Arch Linux or perform system maintenance.
ENDTEXT
MENU LABEL HobbOS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash %KERNEL_PARAMS%


# Persistence boot option (hobbOS)
LABEL archpersist
TEXT HELP
Boot the HobbOS live saving changes to the HOBBOS_DADOS partition.
Create it first with "Guardar arquivos neste pendrive".
ENDTEXT
MENU LABEL HobbOS live com ^persistencia (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_label=HOBBOS_DADOS quiet splash %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the HobbOS live on BIOS with speakup screen reader.
It allows you to install Arch Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL HobbOS live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
