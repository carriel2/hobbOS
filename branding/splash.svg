<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- Fundo do menu de boot BIOS (syslinux). O menu é desenhado por cima, da linha ~170 para baixo. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2f73"/>
      <stop offset="0.6" stop-color="#123f94"/>
      <stop offset="1" stop-color="#0a2457"/>
    </linearGradient>
    <linearGradient id="faixa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb04a"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#fundo)"/>
  <rect y="142" width="640" height="3" fill="url(#faixa)"/>
  <image href="hobbos-start.svg" x="150" y="38" width="80" height="80"/>
  <text x="245" y="92" font-family="DejaVu Sans" font-size="54" font-weight="bold" font-style="italic" fill="#ffffff">hobb<tspan fill="#ffb04a">OS</tspan></text>
  <text x="248" y="120" font-family="DejaVu Sans" font-size="16" fill="#bcd3ff">Live CD / pendrive de resgate</text>
</svg>
