#cloud-config
# Prepara o Arch para gerar a ISO: sistema atualizado + archiso + git.
# qemu-base, edk2-ovmf e python rodam o tests/smoke-test.sh (sem KVM aninhado, fica lento).
# librsvg e ttf-dejavu renderizam os SVGs de branding/ (branding/render.sh).
hostname: hobbos-build
growpart:
  mode: auto
  devices: ["/"]
runcmd:
  - pacman-key --init
  - pacman-key --populate archlinux
  - pacman -Sy --noconfirm archlinux-keyring
  - pacman -Su --noconfirm
  - pacman -S --noconfirm --needed archiso git vim qemu-base edk2-ovmf python librsvg ttf-dejavu dosfstools ffmpeg
  - touch /var/lib/hobbos-build-ready
